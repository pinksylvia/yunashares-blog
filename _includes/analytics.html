<!-- Google Analytics 4 + Google Ads -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NDJ7DQF6HV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NDJ7DQF6HV');
  gtag('config', 'AW-18142919086');

  // 聯盟連結點擊追蹤（蝦皮 / Agoda / KKday）
  // 通用事件：affiliate_click（network / link_url / link_text / page_path）
  // KKday 專用事件：kkday_affiliate_click（需含 cid 參數，額外回傳 kkday_cid）
  (function () {
    var NETWORKS = [
      { name: 'shopee', match: /(^|\.)shopee\.tw/i },
      { name: 'agoda',  match: /(^|\.)agoda\.com/i },
      { name: 'kkday',  match: /(^|\.)kkday\.com/i }
    ];

    function matchNetwork(href) {
      try {
        var host = new URL(href, location.href).hostname;
        for (var i = 0; i < NETWORKS.length; i++) {
          if (NETWORKS[i].match.test(host)) return NETWORKS[i].name;
        }
      } catch (e) {}
      return null;
    }

    function getCid(href) {
      try {
        return new URL(href, location.href).searchParams.get('cid') || '';
      } catch (e) { return ''; }
    }

    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var href = a.getAttribute('href');
      if (!href) return;
      var network = matchNetwork(href);
      if (!network) return;

      var linkText = (a.innerText || '').trim().slice(0, 80);

      // 通用聯盟點擊事件
      gtag('event', 'affiliate_click', {
        network: network,
        link_url: href,
        link_text: linkText,
        page_path: location.pathname
      });

      // KKday 專用轉換事件（需含 cid 才觸發）
      if (network === 'kkday') {
        var cid = getCid(href);
        if (cid) {
          gtag('event', 'kkday_affiliate_click', {
            kkday_cid: cid,
            link_url: href,
            link_text: linkText,
            page_path: location.pathname
          });
        }
      }
    }, { capture: true });
  })();
</script>
